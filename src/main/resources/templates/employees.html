<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Employee Management System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    input { display: block; margin: 4px 0 2px; padding: 6px; width: 280px; }
    .error { color: red; font-size: 13px; }
    .success { color: green; font-weight: bold; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #222; color: white; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <h1>Employee Management System</h1>
  <p class="success" th:if="${message}" th:text="${message}"></p>

  <form th:action="@{/employees}" th:object="${employee}" method="post">
    <label>Full Name</label>
    <input type="text" th:field="*{fullName}">
    <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>

    <label>Email</label>
    <input type="text" th:field="*{email}">
    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

    <label>Department</label>
    <input type="text" th:field="*{department}">
    <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>

    <label>Salary</label>
    <input type="number" step="0.01" th:field="*{salary}">
    <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>

    <br><button type="submit">Save Employee</button>
  </form>

  <h2>Employees (<span th:text="${employees.size()}">0</span>)</h2>
  <table>
    <tr>
      <th>ID</th><th>Name</th><th>Email</th><th>Phone</th>
      <th>Department</th><th>Salary</th><th>Actions</th>
    </tr>
    <tr th:each="e : ${employees}">
      <td th:text="${e.id}"></td>
      <td th:text="${e.fullName}"></td>
      <td th:text="${e.email}"></td>
      <td th:text="${e.phone}"></td>
      <td th:text="${e.department}"></td>
      <td th:text="${e.salary}"></td>
      <td>
        <a th:href="@{/employees/{id}/edit(id=${e.id})}">Edit</a>
        <form class="inline" th:action="@{/employees/{id}/delete(id=${e.id})}" method="post"
              onsubmit="return confirm('Delete this employee?');">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
  </table>
</body>
</html>
