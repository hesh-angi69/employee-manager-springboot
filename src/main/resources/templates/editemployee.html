<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Employee</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    input { display: block; margin: 4px 0 2px; padding: 6px; width: 280px; }
    .error { color: red; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Edit Employee</h1>
  <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
    <label>Full Name</label>
    <input type="text" th:field="*{fullName}">
    <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>

    <label>Email</label>
    <input type="text" th:field="*{email}">
    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

    <label>Department</label>
    <input type="text" th:field="*{department}">
    <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>

    <label>Salary</label>
    <input type="number" step="0.01" th:field="*{salary}">
    <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>

    <br><button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
  </form>
</body>
</html>
